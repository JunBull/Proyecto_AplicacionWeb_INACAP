services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: panol_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - .:/var/www/html
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - panol_network

  db:
    image: postgres:16-alpine
    container_name: panol_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-panol_inacap}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    volumes:
      - panol_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-panol_inacap}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - panol_network

  queue_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: panol_queue_worker
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=90"]
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - panol_network

  mailpit:
    image: axllent/mailpit:latest
    container_name: panol_mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    networks:
      - panol_network

volumes:
  panol_postgres_data:
    name: panol_postgres_data

networks:
  panol_network:
    name: panol_network
    driver: bridge
